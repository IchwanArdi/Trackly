<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e85d04" />
  <meta name="color-scheme" content="dark light" />
  <meta name="msapplication-TileColor" content="#e85d04" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="application-name" content="Trackly" />

  <!--
    Per-page title, description, canonical, Open Graph, Twitter, robots and
    JSON-LD are injected by Unhead (see src/lib/seo.ts). During `build:seo`
    they are baked into the HTML so crawlers and AI agents receive complete
    metadata without executing JavaScript.
  -->

  <!--
    Font dan gambar LCP di-preload dari origin sendiri. Sebelumnya font dimuat
    lewat @import ke Google Fonts, sehingga browser harus menunggu request CSS
    eksternal sebelum bisa render.
  -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/images/hero-dashboard.webp" as="image" type="image/webp" fetchpriority="high" />

  <!--
    Favicons & App Icons
    Google Search supports ICO/PNG favicons (not SVG), so the primary links
    below point to real PNG files at stable URLs. Keep `/favicon.ico` as a
    multi-size fallback for browsers that request it automatically.
  -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="144x144" href="/favicon-144x144.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <!-- Safari pinned-tab icon; Google Search intentionally ignores SVG favicons. -->
  <link rel="mask-icon" href="/trackly-icon-favicon.svg" color="#e85d04" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Machine-readable site description for AI agents and tooling -->
  <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
