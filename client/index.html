<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#e85d04" />
  <meta name="color-scheme" content="dark light" />
  <meta name="msapplication-TileColor" content="#e85d04" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="application-name" content="Trackly" />

  <!--
    Per-page title, description, canonical, Open Graph, Twitter, robots and
    JSON-LD are injected by Unhead (see src/lib/seo.ts). During `build:seo`
    they are baked into the HTML so crawlers and AI agents receive complete
    metadata without executing JavaScript.
  -->

  <!-- Preconnect to Google Fonts for Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/svg+xml" href="/icon-512.png" />
  <link rel="alternate icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="mask-icon" href="/icon-512.png" color="#e85d04" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Machine-readable site description for AI agents and tooling -->
  <link rel="alternate" type="text/plain" href="/llms.txt" title="llms.txt" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
