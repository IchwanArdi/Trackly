name: Trackly Continuous Integration (CI)

# Event pemicu: akan berjalan ketika ada push atau pull request ke branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Definisi jobs: akan berjalan secara paralel
jobs:
  # Job 1: Frontend Verification (Type Check & Build)
  client-verification:
    name: Client (Frontend) Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit
        working-directory: client

      - name: Build Client Bundle
        run: npm run build
        working-directory: client

  # Job 2: Server Verification (Syntax Check)
  server-verification:
    name: Server (Backend) Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Verify Server Syntax
        run: node -c app.js
        working-directory: server

  # Job 3: Docker Image Build Verification
  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest

    # job ini akan berjalan setelah job client-verification dan server-verification selesai
    needs: [client-verification, server-verification]

    # izin akses untuk bisa push image ke GHCR
    permissions:
      contents: read
      packages: write

    # langkah-langkah yang akan dilakukan
    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build server docker image
      - name: Build Server Docker Image
        run: docker build -t trackly-server:ci ./server

      # Step 3: Build client docker image
      - name: Build Client Docker Image
        run: |
          docker build -t trackly-client:ci ./client \
            --build-arg VITE_API_URL=http://202.155.90.183:3001

      # Step 4: Login ke GHCR. Cuma jalan pas push ke branch (bukan pull request)
      # karena PR gak dikasih izin write oleh GitHub demi keamanan.
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 5: Tag & push 2 image (server & client) ke GHCR.
      # Tag ":latest" buat auto-pull VPS, tag ":git-sha" buat rollback/pelacakan.
      # Nama registry harus huruf kecil semua, makanya ada konversi tr.
      - name: Tag & Push Images to GHCR
        if: github.event_name == 'push'
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository }}
          IMAGE_BASE=$(echo $IMAGE_BASE | tr '[A-Z]' '[a-z]')

          docker tag trackly-server:ci $IMAGE_BASE-server:latest
          docker tag trackly-server:ci $IMAGE_BASE-server:${{ github.sha }}
          docker tag trackly-client:ci $IMAGE_BASE-client:latest
          docker tag trackly-client:ci $IMAGE_BASE-client:${{ github.sha }}

          docker push $IMAGE_BASE-server:latest
          docker push $IMAGE_BASE-server:${{ github.sha }}
          docker push $IMAGE_BASE-client:latest
          docker push $IMAGE_BASE-client:${{ github.sha }}
      


  
