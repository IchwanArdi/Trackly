name: Trackly Continuous Integration (CI)

# Event pemicu: akan berjalan ketika ada push atau pull request ke branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Definisi jobs: akan berjalan secara paralel
jobs:
  # Job 1: Frontend Verification (Type Check & Build)
  client-verification:
    name: Client (Frontend) Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit
        working-directory: client

      - name: Build Client Bundle
        run: npm run build
        working-directory: client

  # Job 2: Server Verification (Syntax Check)
  server-verification:
    name: Server (Backend) Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: server

      - name: Verify Server Syntax
        run: node -c app.js
        working-directory: server

  # Job 3: Docker Image Build Verification
  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest

    # job ini akan berjalan setelah job client-verification dan server-verification selesai
    needs: [client-verification, server-verification]

    steps:
      # Step 1: Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Build server docker image
      - name: Build Server Docker Image
        run: docker build -t trackly-server:ci ./server

      # Step 3: Build client docker image
      - name: Build Client Docker Image
        run: |
          docker build -t trackly-client:ci ./client \
            --build-arg VITE_API_URL=http://localhost:3000

      


  
